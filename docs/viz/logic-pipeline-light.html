<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:800px;background:#ffffff;overflow:hidden;font-family:'DM Sans',sans-serif}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,31,63,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,31,63,0.06) 1px,transparent 1px);background-size:40px 40px;opacity:0.5;pointer-events:none}
.wrap{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:60px}
.title{text-align:center;margin-bottom:40px}
.title h1{font-family:'Syne',sans-serif;font-size:32px;font-weight:700;color:#001F3F;letter-spacing:-0.02em}
.title .line{width:48px;height:1px;background:#001F3F;margin:12px auto;opacity:0.3}
.title p{font-family:'DM Sans',sans-serif;font-size:14px;color:#6B7A8D;max-width:720px;line-height:1.6}
.corner{position:absolute;font-family:'DM Mono',monospace;font-size:9px;color:#8FA3B1;letter-spacing:0.2em;text-transform:uppercase}
.tl{top:32px;left:32px}
.tr{top:32px;right:32px}
.meta{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);font-family:'DM Mono',monospace;font-size:9px;color:#8FA3B1;letter-spacing:0.2em}
</style>
</head>
<body>
<div class="wrap">
<div class="title">
<h1>Signal-to-Decision Pipeline</h1>
<div class="line"></div>
<p>How a raw sensor signal becomes a classified threat. Six stages, each transforming the data. Total latency: 1124ms median.</p>
</div>

<svg width="1700" height="420" viewBox="0 0 1700 420" style="position:relative">
  <!-- Pipeline stages -->
  <g id="stages"></g>
  <!-- Connectors -->
  <g id="connectors"></g>
  <!-- Labels -->
  <g id="labels"></g>
</svg>

<div class="corner tl">AEGIS / LOGIC · v1.0</div>
<div class="corner tr">6 STAGES · 1124ms MEDIAN</div>
<div class="meta">AEGIS / PIPELINE / SIGNAL → DECISION</div>
</div>

<script>
(function(){
  const stages = document.getElementById('stages');
  const connectors = document.getElementById('connectors');
  const labels = document.getElementById('labels');
  const NS = 'http://www.w3.org/2000/svg';

  const pipeline = [
    {name:'INGEST', desc:'5 sensors\nparallel fetch', time:'12ms', x:80},
    {name:'NORMALIZE', desc:'z-score\nper modality', time:'8ms', x:340},
    {name:'DETECT', desc:'CV + signal\nthreshold', time:'45ms', x:600},
    {name:'ESTIMATE', desc:'UKF\nsigma points', time:'32ms', x:860},
    {name:'FUSE', desc:'BFT consensus\nspectral', time:'28ms', x:1120},
    {name:'CLASSIFY', desc:'threat score\n+ confidence', time:'15ms', x:1380},
  ];

  const y = 140;
  const boxW = 200, boxH = 140;

  pipeline.forEach((s, i) => {
    // Box
    const rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('x', s.x);
    rect.setAttribute('y', y);
    rect.setAttribute('width', boxW);
    rect.setAttribute('height', boxH);
    rect.setAttribute('fill', '#FFFFFF');
    rect.setAttribute('stroke', '#001F3F');
    rect.setAttribute('stroke-width', '1.5');
    stages.appendChild(rect);

    // Stage number
    const num = document.createElementNS(NS, 'text');
    num.setAttribute('x', s.x + 16);
    num.setAttribute('y', y + 28);
    num.setAttribute('font-family', 'DM Mono,monospace');
    num.setAttribute('font-size', '10');
    num.setAttribute('fill', '#8FA3B1');
    num.setAttribute('letter-spacing', '0.15em');
    num.textContent = `0${i+1}`;
    stages.appendChild(num);

    // Stage name
    const name = document.createElementNS(NS, 'text');
    name.setAttribute('x', s.x + boxW/2);
    name.setAttribute('y', y + 60);
    name.setAttribute('font-family', 'Syne,sans-serif');
    name.setAttribute('font-size', '18');
    name.setAttribute('font-weight', '700');
    name.setAttribute('fill', '#001F3F');
    name.setAttribute('text-anchor', 'middle');
    name.setAttribute('letter-spacing', '-0.01em');
    name.textContent = s.name;
    stages.appendChild(name);

    // Description
    s.desc.split('\n').forEach((line, li) => {
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', s.x + boxW/2);
      t.setAttribute('y', y + 88 + li * 16);
      t.setAttribute('font-family', 'DM Sans,sans-serif');
      t.setAttribute('font-size', '12');
      t.setAttribute('fill', '#6B7A8D');
      t.setAttribute('text-anchor', 'middle');
      t.textContent = line;
      stages.appendChild(t);
    });

    // Time
    const time = document.createElementNS(NS, 'text');
    time.setAttribute('x', s.x + boxW/2);
    time.setAttribute('y', y + boxH - 12);
    time.setAttribute('font-family', 'DM Mono,monospace');
    time.setAttribute('font-size', '11');
    time.setAttribute('fill', '#001F3F');
    time.setAttribute('text-anchor', 'middle');
    time.setAttribute('font-weight', '500');
    time.textContent = s.time;
    stages.appendChild(time);

    // Connector arrow
    if(i < pipeline.length - 1){
      const next = pipeline[i+1];
      const arrow = document.createElementNS(NS, 'path');
      const x1 = s.x + boxW, x2 = next.x;
      arrow.setAttribute('d', `M ${x1} ${y+boxH/2} L ${x2-8} ${y+boxH/2}`);
      arrow.setAttribute('stroke', '#001F3F');
      arrow.setAttribute('stroke-width', '1');
      arrow.setAttribute('fill', 'none');
      arrow.setAttribute('opacity', '0.4');
      connectors.appendChild(arrow);
      // Arrowhead
      const head = document.createElementNS(NS, 'path');
      head.setAttribute('d', `M ${x2-12} ${y+boxH/2-4} L ${x2-4} ${y+boxH/2} L ${x2-12} ${y+boxH/2+4}`);
      head.setAttribute('stroke', '#001F3F');
      head.setAttribute('stroke-width', '1');
      head.setAttribute('fill', 'none');
      head.setAttribute('opacity', '0.4');
      connectors.appendChild(head);
    }
  });

  // Input label
  const input = document.createElementNS(NS, 'text');
  input.setAttribute('x', 80);
  input.setAttribute('y', 100);
  input.setAttribute('font-family', 'DM Mono,monospace');
  input.setAttribute('font-size', '10');
  input.setAttribute('fill', '#8FA3B1');
  input.setAttribute('letter-spacing', '0.15em');
  input.textContent = 'INPUT → raw sensor signals';
  labels.appendChild(input);

  // Output label
  const output = document.createElementNS(NS, 'text');
  output.setAttribute('x', 1580);
  output.setAttribute('y', 100);
  output.setAttribute('font-family', 'DM Mono,monospace');
  output.setAttribute('font-size', '10');
  output.setAttribute('fill', '#8FA3B1');
  output.setAttribute('letter-spacing', '0.15em');
  output.setAttribute('text-anchor', 'end');
  output.textContent = '→ OUTPUT classified threat + confidence';
  labels.appendChild(output);

  // Bottom annotation
  const ann = document.createElementNS(NS, 'text');
  ann.setAttribute('x', 850);
  ann.setAttribute('y', 360);
  ann.setAttribute('font-family', 'DM Sans,sans-serif');
  ann.setAttribute('font-size', '13');
  ann.setAttribute('fill', '#6B7A8D');
  ann.setAttribute('text-anchor', 'middle');
  ann.setAttribute('font-style', 'italic');
  ann.textContent = 'Each stage is independent and modular — sensors can be added without touching estimation logic; estimation algorithms can be swapped without touching coordination.';
  labels.appendChild(ann);
})();
</script>
</body>
</html>
